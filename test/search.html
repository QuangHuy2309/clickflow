<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search · ClickFlow test site</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 16px; color: #1b1d29; }
  h1 { font-size: 30px; text-align: center; margin-bottom: 24px; }
  .box { position: relative; }
  textarea { width: 100%; box-sizing: border-box; padding: 12px 18px; border: 1px solid #cfd4e2; border-radius: 24px; font: inherit; resize: none; height: 48px; overflow: hidden; }
  ul[role=listbox] { position: absolute; left: 0; right: 0; top: 50px; margin: 0; padding: 6px 0; list-style: none; background: #fff; border: 1px solid #cfd4e2; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  ul[role=listbox] li { padding: 7px 18px; cursor: pointer; }
  ul[role=listbox] li:hover { background: #eef; }
  .quick { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e5ee; }
  .quick input { padding: 8px 10px; border: 1px solid #cfd4e2; border-radius: 8px; font: inherit; width: 260px; }
</style>
</head>
<body>
  <h1>Findr</h1>
  <!-- Like Google: a <textarea> search box, no submit button, generated ids/classes. -->
  <form action="results.html" method="get" role="search" id="sf">
    <div class="box">
      <textarea name="q" rows="1" aria-label="Search" autocomplete="off"></textarea>
      <ul role="listbox" hidden></ul>
    </div>
  </form>

  <div class="quick">
    <label for="quick">Quick search (no form, reacts to Enter only)</label><br>
    <input id="quick" autocomplete="off">
    <p id="quickOut"></p>
  </div>

<script>
  // Generated-looking ids/classes that change on every load, like Google's.
  const gen = () => Math.random().toString(36).slice(2, 4) + Math.floor(Math.random() * 9 + 1) + Math.random().toString(36).slice(2, 5);
  const box = document.querySelector('textarea[name=q]');
  box.id = gen();
  box.className = gen();
  const list = document.querySelector('ul[role=listbox]');
  list.id = gen();
  const form = document.getElementById('sf');

  const SUGGESTIONS = ['cats facts', 'cats videos', 'dogs facts', 'dogs videos', 'birds facts'];

  // Enter submits only when keyCode is 13, as many real sites check.
  box.addEventListener('keydown', (e) => {
    if (e.keyCode === 13 && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  box.addEventListener('input', () => {
    const v = box.value.trim().toLowerCase();
    list.replaceChildren();
    if (!v) { list.hidden = true; return; }
    for (const s of SUGGESTIONS.filter((x) => x.startsWith(v))) {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.className = gen();
      li.textContent = s;
      // Acts on mousedown and the list disappears before "click" would fire.
      li.addEventListener('mousedown', (e) => {
        e.preventDefault();
        box.value = s;
        list.hidden = true;
        form.requestSubmit();
      });
      list.append(li);
    }
    list.hidden = !list.children.length;
  });
  box.addEventListener('blur', () => { list.hidden = true; });

  document.getElementById('quick').addEventListener('keydown', (e) => {
    if (e.keyCode === 13) document.getElementById('quickOut').textContent = `Searched: ${e.target.value}`;
  });
</script>
</body>
</html>
